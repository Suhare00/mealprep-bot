name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://mealprep:mealprep@localhost:5432/mealprep_test?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mealprep_test
          POSTGRES_USER: mealprep
          POSTGRES_PASSWORD: mealprep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mealprep -d mealprep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test PostgreSQL integration
        run: make test-integration

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build Docker image
        run: docker build -t mealprep-bot:ci .

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
